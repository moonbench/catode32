[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  # Lets esp-backtrace walk the stack for the panic record.
  "-C", "force-frame-pointers",
]

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = [
  "-C", "link-arg=-Tlinkall.x",
  # Lets esp-backtrace walk the stack for the panic record.
  "-C", "force-frame-pointers",
]

# Desktop build on Windows: link the C runtime statically so the exe runs
# without the Visual C++ Redistributable installed.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
ESP_LOG = "info"
# The Windows desktop build compiles the SDL2 that ships with sdl2-sys (2.26)
# using CMake. That SDL declares CMake 3.0 compatibility, which CMake 4 refuses
# to configure unless this is set.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
