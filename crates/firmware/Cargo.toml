[package]
name = "catode32-firmware"
version = "0.10.0"
edition = "2021"
description = "ESP32 firmware binary for catode32"
license = "MIT"
repository = "https://github.com/moonbench/catode32"

[features]
default = ["c6", "lang-en"]
c6 = [
    "catode32-core/c6",
    "esp-hal/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-rtos/esp32c6",
]
c3 = [
    "catode32-core/c3",
    "esp-hal/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-rtos/esp32c3",
]

# Language selection — pass-through to core. Exactly one should be active.
lang-en = ["catode32-core/lang-en"]
lang-de = ["catode32-core/lang-de"]
lang-es = ["catode32-core/lang-es"]
lang-fr = ["catode32-core/lang-fr"]
lang-it = ["catode32-core/lang-it"]
lang-nl = ["catode32-core/lang-nl"]

[dependencies]
catode32-core = { path = "../core", default-features = false }
esp-hal = { version = "1.1.1", default-features = false, features = ["rt"] }
# Backtrace capture only; the panic handler lives in `src/panic.rs` so it can
# record the panic to RTC RAM and reset.
esp-backtrace = { version = "0.19.0", default-features = false, features = ["println"] }
esp-println = { version = "0.17.0", default-features = false }
esp-bootloader-esp-idf = { version = "0.5.0", default-features = false }
esp-alloc = "0.10.0"
esp-rtos = { version = "0.3.0", default-features = false, features = ["esp-radio", "esp-alloc"] }
