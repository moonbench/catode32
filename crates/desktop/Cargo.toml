[package]
name = "catode32-desktop"
version = "0.12.0"
edition = "2021"
description = "Desktop simulator for catode32"
license = "MIT"
repository = "https://github.com/moonbench/catode32"

[features]
default = ["lang-en"]
lang-en = ["catode32-core/lang-en"]
lang-de = ["catode32-core/lang-de"]
lang-es = ["catode32-core/lang-es"]
lang-fr = ["catode32-core/lang-fr"]
lang-it = ["catode32-core/lang-it"]
lang-nl = ["catode32-core/lang-nl"]

[dependencies]
catode32-core = { path = "../core", default-features = false, features = ["desktop"] }
embedded-graphics = "0.8.2"
embedded-graphics-simulator = "0.7.0"

# Windows: compile SDL2 from source and link it into the exe, so the build
# needs no SDL2 download and the exe runs without SDL2.dll. Needs CMake.
# Only adds features to the simulator's own sdl2 dependency.
[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }

[[bin]]
name = "catode32-desktop"
path = "src/main.rs"
