[package]
name = "catode32-core"
version = "0.16.0"
edition = "2021"
description = "Core game logic for catode32 — shared between firmware and desktop builds"
license = "MIT"
repository = "https://github.com/moonbench/catode32"

[features]
# Board capabilities. A board feature turns on what its hardware has; code
# for hardware a board lacks is compiled out, not stubbed.
#
# `rgb-led`: a colour LED (the C6's WS2812, or the desktop simulator's
# on-screen one). Without it the board has a single-colour LED, so colour
# tools (the flashlight, the RGB LED debug scene) don't exist.
rgb-led = []

c6 = [
    "rgb-led",
    "dep:esp-hal",
    "dep:esp-println",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-storage",
    "dep:esp-hal-smartled",
    "dep:smart-leds",
    "dep:esp-radio",
    "dep:esp-rtos",
    "dep:embassy-futures",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-sync",
    "dep:trouble-host",
    "dep:static_cell",
    "dep:esp-radio-rtos-driver",
    "esp-hal/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
    "esp-storage/esp32c6",
    "esp-hal-smartled/esp32c6",
    "esp-radio/esp32c6",
    "esp-rtos/esp32c6",
]
c3 = [
    "dep:esp-hal",
    "dep:esp-println",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-storage",
    "dep:esp-radio",
    "dep:esp-rtos",
    "dep:embassy-futures",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-sync",
    "dep:trouble-host",
    "dep:static_cell",
    "dep:esp-radio-rtos-driver",
    "esp-hal/esp32c3",
    "esp-println/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-storage/esp32c3",
    "esp-radio/esp32c3",
    "esp-rtos/esp32c3",
]
# Host-side build: skips esp-* deps, swaps platform modules for std-backed shims.
# The simulator models the C6, LED included (drawn beside the screen).
desktop = ["rgb-led"]

# Language selection — exactly one should be active. Defaults to English.
lang-en = ["catode32-i18n-macros/lang-en"]
lang-de = ["catode32-i18n-macros/lang-de"]
lang-es = ["catode32-i18n-macros/lang-es"]
lang-fr = ["catode32-i18n-macros/lang-fr"]
lang-it = ["catode32-i18n-macros/lang-it"]
lang-nl = ["catode32-i18n-macros/lang-nl"]

[dependencies]
esp-hal = { version = "1.2.2", default-features = false, features = ["rt"], optional = true }
esp-println = { version = "0.18.0", default-features = false, features = ["auto"], optional = true }
esp-bootloader-esp-idf = { version = "0.6.0", default-features = false, optional = true }
esp-storage = { version = "0.10.0", default-features = false, optional = true }
esp-hal-smartled = { version = "0.18.0", default-features = false, optional = true }
esp-radio = { version = "=1.0.0-beta.1", default-features = false, features = ["wifi", "esp-now", "ble", "esp-alloc", "unstable"], optional = true }
esp-rtos = { version = "0.4.0", default-features = false, features = ["esp-radio", "esp-alloc", "embassy"], optional = true }
embassy-futures = { version = "0.1", optional = true }
# Bluetooth remote: an async BLE host on top of esp-radio's controller, run
# on an embassy executor that esp-rtos provides. trouble-host 0.7 is the
# release built on bt-hci 0.9, which is what esp-radio 1.0.0-beta.1 speaks.
embassy-executor = { version = "0.10", default-features = false, optional = true }
embassy-time = { version = "0.5.1", default-features = false, optional = true }
embassy-sync = { version = "0.8", default-features = false, optional = true }
# `central` is unused but needed: with `security` on, 0.7 only defines the
# GAP attribute count when `central` is enabled too.
trouble-host = { version = "=0.7.0", default-features = false, features = ["peripheral", "central", "gatt", "derive", "security", "default-packet-pool"], optional = true }
static_cell = { version = "2.1", optional = true }
# The scheduler interface esp-radio uses; we use it to give the BLE host
# its own thread.
esp-radio-rtos-driver = { version = "0.4.2", default-features = false, optional = true }

ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
heapless = { version = "0.8", features = ["serde"] }
micromath = "2"
smart-leds = { version = "0.4.0", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde-json-core = "0.6"
catode32-i18n-macros = { path = "../i18n-macros", default-features = false }
